
<!DOCTYPE html>

<head>

    <title>Dynamic Image Styling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #myImage {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Curiyaha Sawirka -->
    <img id="myImage" src="https://via.placeholder.com/200" alt="Sample Image" style="width: 200px; height: 200px; border: 2px solid black;">
    
    <br><br>
    
    <!-- Batoonka kicinaya shaqada changeImage -->
    <button onclick="changeImage()">Beddel Qaabka Sawirka</button>

    <!-- Isku xirka faylka JavaScript-ka -->
    <script src="script.js"></script>
</body>
</html>
